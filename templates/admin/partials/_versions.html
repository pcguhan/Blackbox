{% if current_user.is_authenticated and current_user.is_admin %}
<button type="button" class="btn btn-outline-secondary btn-sm mt-2" data-versions-open
        data-url="{{ url_for('admin_versions.versions') }}">
    Technology versions
</button>
<dialog id="versions-dialog" class="bg-body text-body border rounded p-3" aria-labelledby="versions-title"
        style="width: min(48rem, 95vw); max-height: 85vh; overflow: auto">
    <div class="d-flex align-items-center justify-content-between gap-3">
        <h2 id="versions-title" class="h4 mb-0">Technology versions</h2>
        <form method="dialog">
            <button type="submit" class="btn btn-outline-secondary btn-sm" autofocus>Close</button>
        </form>
    </div>
    <div class="mt-3" data-versions-body aria-live="polite"></div>
    <div class="mt-3">
        <button type="button" class="btn btn-primary btn-sm" data-versions-copy disabled>Copy as text</button>
        <span class="ms-2" role="status" data-versions-status></span>
    </div>
</dialog>
<script src="{{ url_for('static', filename='js/admin-versions.js') }}" defer></script>
{% endif %}
