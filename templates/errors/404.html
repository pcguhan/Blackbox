{% extends "base.html" %}

{% block title %}404 Not Found - {{ ctf_name }}{% endblock %}

{% block content %}
<div class="error-page text-center py-5">
    <p class="page-status-code">404</p>
    <h1>Page not found</h1>
    <p class="text-muted">The page may have moved or the address may be incorrect.</p>
    <div class="participant-actions">
        <a href="{{ url_for('index') }}" class="btn btn-primary">Back to home</a>
        {% if current_user.is_authenticated %}
        <a href="{{ url_for('challenges.list_challenges') }}" class="btn btn-outline-primary">Browse challenges</a>
        {% endif %}
    </div>
</div>
{% endblock %}
